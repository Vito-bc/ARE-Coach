name: Flutter CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --no-pub

  content:
    name: Content checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keep the content gate small: schema checks need pydantic and the
      # generated-candidate approval regressions need openpyxl. Do not install
      # the grader/embedding stack (anthropic, sentence-transformers, torch).
      - name: Install dependencies
        run: pip install "pydantic==2.9.2" "openpyxl==3.1.5"

      # Guards the question bank and flashcards against defects that have each
      # already reached main once: broken encoding, citations to a superseded
      # code edition, duplicate ids, answer-position skew, and docs advertising
      # a question count the bank doesn't actually have.
      - name: Check question bank
        working-directory: tools/question_audit
        run: python -m src.check_bank

      - name: Test generated-candidate approval gate
        working-directory: tools/question_audit
        run: python -m unittest discover -s tests -v

  functions:
    name: Cloud Functions tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Tests use only Node's built-in test runner (node:test) and the pure
      # library modules — no npm install, no Firebase emulator needed. Covers
      # the money path (entitlement: role is not proof of payment) and the
      # anti-fabrication retrieval gates (off-topic question -> no sources).
      - name: Run Cloud Functions tests
        working-directory: functions
        run: node --test

  apple-integration:
    name: Apple verifier and Firestore integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install locked verifier and rules-test dependencies
        working-directory: functions
        run: npm ci
      - name: Verify real signed fixtures
        working-directory: functions
        run: node --test integration/apple_verifier.spec.cjs
      - name: Check atomic ownership and rules on local demo emulator
        run: npx --yes firebase-tools@15.8.0 emulators:exec --only firestore --project demo-are-coach --config firebase.test.json "node --test functions/integration/apple_ownership.spec.cjs"
