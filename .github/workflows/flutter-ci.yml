name: Flutter CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --no-pub

  content:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Content checks
          - os: windows-latest
            name: Content checks (Windows)
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keep the content gate small: schema checks need pydantic and the
      # generated-candidate approval regressions need openpyxl, and synthetic
      # page-aware ingestion tests need pypdf. Do not install
      # the grader/embedding stack (anthropic, sentence-transformers, torch).
      - name: Install dependencies
        run: pip install "pydantic==2.9.2" "openpyxl==3.1.5" "pypdf==6.14.2"

      # Guards the question bank and flashcards against defects that have each
      # already reached main once: broken encoding, citations to a superseded
      # code edition, duplicate ids, answer-position skew, and docs advertising
      # a question count the bank doesn't actually have.
      - name: Check question bank
        working-directory: tools/question_audit
        run: python -m src.check_bank

      - name: Test generated-candidate approval gate
        working-directory: tools/question_audit
        run: python -m unittest discover -s tests -v

  functions:
    name: Cloud Functions tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Tests use only Node's built-in test runner (node:test) and the pure
      # library modules — no npm install, no Firebase emulator needed. Covers
      # the money path (entitlement: role is not proof of payment) and the
      # anti-fabrication retrieval gates (off-topic question -> no sources).
      - name: Run Cloud Functions tests
        working-directory: functions
        run: node --test

  backup-restore:
    name: Backup/restore tool unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/backup_restore/package-lock.json

      # The tool has its own package.json/package-lock.json and is not part of
      # functions/ -- its only dependency is firebase-admin, which
      # test/serialize.test.js needs at import time for real Timestamp/
      # GeoPoint/DocumentReference instances. Hence npm ci here rather than in
      # the "Cloud Functions tests" job, which deliberately installs nothing.
      - name: Install locked backup/restore dependencies
        working-directory: tools/backup_restore
        run: npm ci

      # Emulator-free half of the tool's suite: the type-preserving JSON codec,
      # the read-only Firestore wrapper, and the production-target guard's
      # decision logic. `node --test` from the package root discovers only
      # test/*.test.js -- integration/*.spec.cjs does not match Node's default
      # test-file patterns and runs in the emulator job instead.
      - name: Run backup/restore unit tests
        working-directory: tools/backup_restore
        run: node --test

  apple-integration:
    name: Apple verifier and Firestore integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            tools/backup_restore/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install locked verifier and rules-test dependencies
        working-directory: functions
        run: npm ci
      # Separate lockfile, separate install -- the backup/restore tool's deps
      # are deliberately not merged into functions/.
      - name: Install locked backup/restore dependencies
        working-directory: tools/backup_restore
        run: npm ci
      - name: Verify real signed fixtures
        working-directory: functions
        run: node --test integration/apple_verifier.spec.cjs
      - name: Verify Coach prompt provenance against a stubbed model client
        working-directory: functions
        run: node --test integration/coach.spec.cjs
      # One emulator start covers both suites. Two SEQUENTIAL `node --test`
      # invocations, not one: `node --test` runs files concurrently, and these
      # two groups fight over the same emulator database --
      # apple_ownership.spec.cjs calls env.clearFirestore() in beforeEach while
      # drill.spec.cjs seeds and recursiveDelete()s the covered collections.
      # Interleaving them would flake. Paths are repo-root-relative because
      # emulators:exec runs from the repo root; the tool's specs resolve their
      # own paths from __dirname and set cwd explicitly for the CLIs they
      # spawn, so they do not depend on the caller's cwd.
      - name: Check atomic ownership, rules, and the backup/restore drill on local demo emulator
        run: >-
          npx --yes firebase-tools@15.8.0 emulators:exec --only firestore
          --project demo-are-coach --config firebase.test.json
          "node --test functions/integration/apple_ownership.spec.cjs functions/integration/user_terms_assent_rules.spec.cjs
          && node --test tools/backup_restore/integration/drill.spec.cjs tools/backup_restore/integration/read_only_escape.spec.cjs"
